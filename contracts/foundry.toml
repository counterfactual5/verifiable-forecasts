[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
# lib/v4-core: Uniswap v4-core v4.0.0 (e50237c), src + test/utils/CurrencySettler.sol only.
# lib/v4-periphery: Uniswap v4-periphery 0c4e5bd, test/shared/HookMiner.sol (MIT) only.
remappings = [
    "@uniswap/v4-core/=lib/v4-core/",
    "forge-std/=lib/forge-std/src/",
]
solc_version = "0.8.28"
via_ir = false
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

# EZKL verifiers and VolMarket exceed EIP-170 without the optimizer; enable it only for these paths.
additional_compiler_profiles = [{ name = "optimized", optimizer = true, optimizer_runs = 200 }]
compilation_restrictions = [
    { paths = "src/verifier/**", optimizer = true, optimizer_runs = 200 },
    { paths = "src/VolMarket.sol", optimizer = true, optimizer_runs = 200 },
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64

[fmt]
ignore = ["src/verifier/**/*.sol"]
