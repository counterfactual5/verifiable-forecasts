<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verifiable AI Forecasts · round dashboard</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #30363d; --text: #e6edf3; --muted: #a3acb6;
    --accent: #58a6ff; --ok: #3fb950; --bad: #f85149; --warn: #d29922; --win: #a371f7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { padding: 24px 32px 8px; }
  h1 { margin: 0; font-size: 22px; }
  .sub { color: var(--muted); margin-top: 4px; }
  main { display: grid; gap: 16px; padding: 16px 32px 32px;
         grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px;
          min-width: 0; overflow-x: auto; }
  .card.wide { grid-column: 1 / -1; }
  .card h2 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
             color: var(--muted); font-weight: 600; }
  .big { font-size: 30px; font-weight: 650; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
           white-space: nowrap; }
  .badge.ok { background: rgba(63,185,80,.15); color: var(--ok); }
  .badge.bad { background: rgba(248,81,73,.15); color: var(--bad); }
  .badge.warn { background: rgba(210,153,34,.15); color: var(--warn); }
  .badge.zk { background: rgba(88,166,255,.15); color: var(--accent); }
  .badge.commit { background: rgba(139,148,158,.18); color: var(--text); }
  .badge .en { font-size: 11px; font-weight: 500; opacity: .8; }
  table { width: 100%; border-collapse: collapse; }
  /* Edge shadows show only while more columns are hidden on that side ("local" covers them at the ends). */
  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch;
    background:
      linear-gradient(to right, var(--panel) 40%, rgba(22,27,34,0)) left / 28px 100% no-repeat local,
      linear-gradient(to left, var(--panel) 40%, rgba(22,27,34,0)) right / 28px 100% no-repeat local,
      radial-gradient(farthest-side at 0 50%, rgba(163,172,182,.4), rgba(163,172,182,0)) left / 14px 100% no-repeat scroll,
      radial-gradient(farthest-side at 100% 50%, rgba(163,172,182,.4), rgba(163,172,182,0)) right / 14px 100% no-repeat scroll; }
  .nowrap { white-space: nowrap; }
  .scroll-hint { display: none; color: var(--muted); font-size: 12px; text-align: right; margin-top: 4px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td.num, th.num { text-align: right; }
  .probs { display: flex; gap: 3px; align-items: flex-end; height: 40px; }
  .probs div { width: 20px; background: #2d333b; border-radius: 3px 3px 0 0; position: relative; }
  .probs div.win { background: var(--win); }
  .buckets { display: flex; gap: 4px; margin-top: 8px; }
  .buckets div { flex: 1; padding: 8px 4px; text-align: center; border-radius: 6px; background: #21262d;
                 font-size: 12px; color: var(--muted); }
  .buckets div.win { background: rgba(163,113,247,.2); color: var(--text); outline: 1px solid var(--win); }
  .meter { height: 8px; background: #21262d; border-radius: 4px; overflow: hidden; margin: 4px 0 10px; }
  .meter > div { height: 100%; }
  a { color: var(--accent); text-decoration: none; }
  svg text { fill: var(--muted); font-size: 12px; }
  footer { color: var(--muted); padding: 0 32px 24px; font-size: 12px; }
  #error { color: var(--bad); padding: 32px; }
  .fee-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 10px; }
  .fee-tile { background: #21262d; border: 1px solid transparent; border-radius: 8px; padding: 8px 12px; }
  .fee-tile .sub { margin-top: 0; }
  .fee-tile.best { border-color: var(--ok); }
  .fee-mae { font-size: 20px; font-weight: 650; }
  @media (max-width: 600px) {
    header { padding: 16px 16px 4px; }
    main { padding: 12px 12px 24px; gap: 12px; }
    footer { padding: 0 16px 20px; }
    .card { padding: 12px; }
    .badge:has(.en) { border-radius: 8px; }
    .badge .en { display: block; white-space: nowrap; }
    .badge .sep { display: none; }
  }
  @media (max-width: 1000px) { .scroll-hint { display: block; } }
</style>
</head>
<body>
<header>
  <h1>Verifiable AI Forecasts · VolMarket round</h1>
  <div class="sub" id="subtitle">loading…</div>
</header>
<main id="app"></main>
<footer id="source"></footer>
<script>
const BUCKET_NAMES = (b) => [`< ${b[0]}`, `${b[0]}–${b[1]}`, `${b[1]}–${b[2]}`, `${b[2]}–${b[3]}`, `≥ ${b[3]}`];
const ETHERSCAN = "https://etherscan.io/address/";
const short = (a) => a.slice(0, 6) + "…" + a.slice(-4);
const link = (a) => `<a class="mono" href="${ETHERSCAN}${a}" target="_blank" rel="noopener">${short(a)}</a>`;
const badge = (ok, yes, no) => `<span class="badge ${ok ? "ok" : "bad"}">${ok ? yes : no}</span>`;
const fmtTime = (t) => new Date(t * 1000).toISOString().replace("T", " ").slice(0, 16) + " UTC";
const eth = (wei) => (Number(BigInt(wei) / 10n ** 12n) / 1e6).toFixed(4);

const SCAN = "https://etherscan.io";
const blockLink = (n) => `<a class="mono" href="${SCAN}/block/${n}" target="_blank" rel="noopener">${n.toLocaleString()}</a>`;
const txLink = (h, text) => `<a class="mono" href="${SCAN}/tx/${h}" target="_blank" rel="noopener">${text ?? short(h)}</a>`;
const PALETTE = ["#58a6ff", "#3fb950", "#d29922", "#a371f7", "#f778ba", "#79c0ff"];
// The hint is shown only up to 1000 px, where a card's content box is under 900 px, so these tables always overflow.
const scrollTable = (inner, minWidth = 0) => `<div class="table-scroll"><table${minWidth ? ` style="min-width:${minWidth}px"` : ""}>${inner}</table></div>` +
  (minWidth >= 900 ? `<div class="scroll-hint">scroll →</div>` : "");

async function load() {
  const param = new URLSearchParams(location.search).get("data");
  const sources = [param, "../demo/out/fork_replay.json", "sample-replay.json",
                   "../demo/out/fork_round.json", "sample-round.json"];
  for (const src of sources.filter(Boolean)) {
    try {
      const r = await fetch(src, { cache: "no-store" });
      if (r.ok) return { data: await r.json(), src };
    } catch (_) { /* try the next source */ }
  }
  throw new Error("No round data found. Run `bash demo/run.sh`, or serve the repo root over HTTP.");
}

function segmentChart(fork, real) {
  const all = fork.concat(real || []);
  const lo = Math.min(...all) - 2, hi = Math.max(...all) + 2;
  const W = Math.min(1200, chartWidth), H = 220, P = W < 600 ? 52 : 64;
  const x = (i) => P + i * (W - 2 * P) / (fork.length - 1);
  const y = (v) => H - 22 - (v - lo) * (H - 40) / (hi - lo);
  const path = (s) => s.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const dots = (s, c) => s.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${c}"/>`).join("");
  const labels = fork.map((_, i) => `<text x="${x(i)}" y="${H - 4}" text-anchor="middle">${i + 1}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">
    <text x="0" y="${y(hi - 2) + 4}">${hi - 2}</text><text x="0" y="${y(lo + 2) + 4}">${lo + 2}</text>
    ${real ? `<path d="${path(real)}" fill="none" stroke="#8b949e" stroke-dasharray="4 4"/>` : ""}
    <path d="${path(fork)}" fill="none" stroke="#58a6ff" stroke-width="2"/>${dots(fork, "#58a6ff")}
    ${labels}</svg>
    <div class="sub"><span style="color:#58a6ff">━</span> segment mean tick on the fork (from VolMarket checkpoints)
    ${real ? ` &nbsp; <span>┅</span> real mainnet 5-min TWAP tick (replay target)` : ""}</div>`;
}

function render({ data: d, src }) {
  const o = d.outcome, r = d.round, cl = d.chainlink, names = BUCKET_NAMES(r.bounds);
  const status = o.voided ? badge(false, "", "Voided · refunds") : o.settled
    ? badge(true, "Settled", "") : `<span class="badge warn">Open</span>`;
  document.getElementById("subtitle").innerHTML =
    `${d.network} · fork block ${d.fork_block.toLocaleString()} · round #${r.id} ${status}`;
  const priceOk = cl.deviation_bps <= cl.max_deviation_bps && cl.feed_age_s <= cl.max_age_s;
  const tamper = Object.fromEntries(d.tamper_checks.map((t) => [t.agent, t]));
  const card = (title, html, cls = "") => `<section class="card ${cls}"><h2>${title}</h2>${html}</section>`;

  const roundCard = card("Round", `<dl class="kv">
    <dt>Status</dt><dd>${status}</dd>
    <dt>Window</dt><dd>${fmtTime(r.start)} + ${r.n_segments} × ${r.delta_s} s</dd>
    <dt>Pool</dt><dd>${link(d.contracts.pool)} Uniswap V3 ETH/USDC 0.05%</dd>
    <dt>Market</dt><dd class="mono">${short(d.contracts.market)} (fork-local)</dd>
    <dt>Features</dt><dd class="mono">${r.features.map((f) => f / 128).join(" ")}</dd>
    <dt>Window path</dt><dd>${d.window.mode === "replay" ? "real mainnet hour replayed" : "scripted swaps"}</dd>
    <dt>Settle gas</dt><dd>${o.gas_used.toLocaleString()}</dd></dl>
    <div class="sub">Features: 16 differences of 5-min mean ticks, computed by the contract from the pool's
    <span class="mono">observe()</span> at round creation (the zk public inputs).</div>`);

  const rvCard = card("Realized volatility", `
    <div class="big">${o.realized_vol} <span class="sub">tick²</span></div>
    <dl class="kv"><dt>Off-chain recompute</dt><dd>${d.offchain_recompute.realized_vol}
      ${d.offchain_recompute.realized_vol === o.realized_vol ? badge(true, "match", "") : badge(false, "", "mismatch")}</dd>
    ${d.window.real_realized_vol != null ? `<dt>Real mainnet hour</dt><dd>${d.window.real_realized_vol}</dd>` : ""}
    <dt>Winning bucket</dt><dd>#${o.winning_bucket} (${names[o.winning_bucket]} tick²)</dd></dl>
    <div class="buckets">${names.map((n, i) => `<div class="${i === o.winning_bucket ? "win" : ""}">#${i}<br>${n}</div>`).join("")}</div>`);

  const devPct = Math.min(100, cl.deviation_bps / cl.max_deviation_bps * 100);
  const agePct = Math.min(100, cl.feed_age_s / cl.max_age_s * 100);
  const clCard = card("Chainlink cross-check", `
    <div>${badge(priceOk && !o.events.price_check_failed, "Pool price matches feed", "Check failed · round voided")}</div>
    <dl class="kv" style="margin-top:10px">
    <dt>Chainlink ETH/USD</dt><dd>$${cl.feed_price_usd.toFixed(2)} ${link(cl.feed)}</dd>
    <dt>Pool TWAP (last Δ)</dt><dd>$${cl.pool_price_usd.toFixed(2)} (tick ${cl.pool_mean_tick})</dd></dl>
    <div class="sub" style="margin-top:8px">Deviation ${cl.deviation_bps} bps / max ${cl.max_deviation_bps}</div>
    <div class="meter"><div style="width:${devPct}%;background:${devPct < 100 ? "var(--ok)" : "var(--bad)"}"></div></div>
    <div class="sub">Feed age ${cl.feed_age_s} s / max ${cl.max_age_s}</div>
    <div class="meter"><div style="width:${agePct}%;background:${agePct < 100 ? "var(--warn)" : "var(--bad)"}"></div></div>`);

  const fs = d.fee_split;
  const isZk = (a) => (a.model_type ?? "zk") === "zk";
  const typeBadge = (a) => isZk(a)
    ? `<span class="badge zk" title="reveal carries an EZKL proof the contract verified">zk proof</span>`
    : `<span class="badge commit" title="committed before the deadline; no proof of which model made it">commit-only</span>`;
  const rows = d.agents.map((a) => {
    const max = Math.max(...a.probs);
    const bars = a.probs.map((p, i) => `<div class="${i === o.winning_bucket ? "win" : ""}"
      style="height:${Math.max(2, p / max * 40)}px" title="#${i} ${names[i]}: ${(p * 100).toFixed(2)}%"></div>`).join("");
    const rep = a.reputation, repVal = Number(rep.summary_value) / 10 ** rep.summary_decimals;
    const t = tamper[a.agent];
    const verification = isZk(a)
      ? `${badge(a.proof_verified_onchain, "verified onchain", "missing")}<br>
        ${t ? badge(!t.tampered_output_verifies, "tampered proof rejected", "tamper accepted!") : ""}
        <div class="sub">prove ${a.prove_seconds ?? "?"} s · ${a.prove_peak_mb ?? "?"} MB</div>`
      : `${badge(a.revealed, "committed, revealed in time", "not revealed")}
        <div class="sub">no proof · source ${a.forecast_source ?? "?"}</div>`;
    const reward = a.predictor_reward_wei != null
      ? `<td class="num">${eth(a.predictor_reward_wei)}<div class="sub">${a.beat_baseline ? "beat baseline" : "at/below baseline"}</div></td>`
      : `<td class="num">–</td>`;
    return `<tr><td><b class="nowrap">${a.agent}</b> ${typeBadge(a)}<div class="sub mono nowrap">${short(a.address)}</div></td>
      <td><div class="probs">${bars}</div></td>
      <td class="num">${(a.p_win * 100).toFixed(1)}%</td>
      <td class="num"><b>${a.log_score_float.toFixed(3)}</b></td>
      ${reward}
      <td>${verification}</td>
      <td class="nowrap">agentId <b>${a.agent_id}</b><div class="sub">getSummary: ${rep.count} × ${repVal.toFixed(3)}
        <br><span class="mono">${rep.tag1} / ${rep.tag2}</span></div></td></tr>`;
  }).join("");
  const agentsCard = card("Agents · forecasts, scores and ERC-8004 reputation", `${scrollTable(`
    <tr><th>Agent</th><th>Bucket probabilities (purple = outcome)</th><th class="num">p(outcome)</th>
    <th class="num">Log score</th><th class="num">Fee share (WETH)</th><th>Verification</th><th>ERC-8004 reputation ${link(d.contracts.erc8004_reputation)}</th></tr>
    ${rows}`, 960)}
    <div class="sub" style="margin-top:8px">Log score = max(ln p_outcome, −18), computed in VolMarket.settle and written by the
    market contract to the deployed ERC-8004 Reputation Registry (summary filtered to the market as the only client;
    commit-only scores carry tag2 <span class="mono">…-commit</span>). Every agent committed a hash before
    ${r.commit_deadline ? fmtTime(r.commit_deadline) : "the commit deadline"} and revealed before the window opened.
    ${fs ? `Forecasters above the uniform baseline (${fs.baseline_log_score_float.toFixed(3)}) split ${fs.predictor_share_bps / 100}% of the fee pro rata to their excess score.` : ""}</div>`, "wide");

  const chartCard = card("Window · 12 segments of 5 minutes",
    segmentChart(d.offchain_recompute.segment_mean_ticks, d.window.real_segment_ticks), "wide");

  const betRows = d.bets.map((b) => `<tr><td class="mono nowrap">${short(b.bettor)}</td><td>#${b.bucket}</td>
    <td class="num">${eth(b.amount_wei)}</td><td class="num">${eth(b.payout_wei)}</td></tr>`).join("");
  const betsCard = card("Parimutuel bets (WETH)", `${scrollTable(`<tr><th>Bettor</th><th>Bucket</th>
    <th class="num">Stake</th><th class="num">Payout</th></tr>${betRows}`)}
    <div class="sub" style="margin-top:8px">Fee ${r.fee_bps / 100}% of the pool${fs
      ? `: ${eth(fs.fee_wei)} WETH, of which ${eth(fs.owner_wei)} to the owner and ${eth(fs.predictors_wei)} to forecasters` : d.fee_collected_wei != null
      ? `: ${eth(d.fee_collected_wei)} WETH collected to the owner` : ""}${d.market_balance_after_wei != null
      ? `, ${d.market_balance_after_wei} wei left in the market` : ""}.
    Bettor 0 followed the agents' consensus.</div>`);

  const c = d.contracts;
  const contractsCard = card("Contracts", `<dl class="kv">
    <dt>ERC-8004 Identity</dt><dd>${link(c.erc8004_identity)}</dd>
    <dt>ERC-8004 Reputation</dt><dd>${link(c.erc8004_reputation)}</dd>
    <dt>Chainlink ETH/USD</dt><dd>${link(c.chainlink_feed)}</dd>
    <dt>Uniswap V3 pool</dt><dd>${link(c.pool)}</dd>
    <dt>Settlement token</dt><dd>${link(c.settlement_token)} WETH</dd>
    <dt>VolMarket</dt><dd class="mono">${short(c.market)} (deployed on the fork)</dd></dl>`);

  document.getElementById("app").innerHTML =
    roundCard + rvCard + clCard + agentsCard + chartCard + betsCard + contractsCard;
  document.getElementById("source").textContent =
    `Data: ${src} · generated ${d.generated_at ? new Date(d.generated_at * 1000).toISOString() : "?"} · read-only view, no wallet, no writes.`;
}

// The viewBox width must equal the rendered width on narrow screens, or svg text scales below its CSS size.
let chartWidth = 1200;
function measureChartWidth() {
  const el = document.querySelector("#app .card.wide");
  if (!el) return chartWidth;
  const cs = getComputedStyle(el);
  return Math.floor(el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight));
}

// min / max bound the axis, never the data, and only when every value already respects them.
function lineChart(series, labels, { zero = null, fmt = null, tip = null, H = 240, min = null, max = null } = {}) {
  const vals = series.flatMap((s) => s.values).filter((v) => v != null).concat(zero ?? []);
  const dmin = Math.min(...vals), dmax = Math.max(...vals);
  let lo = dmin, hi = dmax;
  if (hi === lo) { hi += 1; lo -= 1; }
  if (min != null && dmin >= min) lo = Math.max(lo, min);
  if (max != null && dmax <= max) hi = Math.min(hi, max);
  const raw = (hi - lo) / 5, mag = 10 ** Math.floor(Math.log10(raw));
  const st = [1, 2, 5, 10].map((k) => k * mag).find((k) => k >= raw * (1 - 1e-9));
  const dp = Math.max(0, -Math.floor(Math.log10(st) + 1e-9));
  const k0 = Math.floor(lo / st + 1e-9), k1 = Math.ceil(hi / st - 1e-9);
  lo = k0 * st; hi = k1 * st;
  const ticks = Array.from({ length: k1 - k0 + 1 }, (_, i) => Number(((k0 + i) * st).toFixed(dp)) || 0);
  const axisFmt = fmt ?? ((v) => v.toFixed(dp)), tipFmt = tip ?? fmt ?? ((v) => v.toFixed(Math.max(2, dp + 2)));
  const W = Math.min(1200, chartWidth), L = 70, R = 16, T = 10, B = 26;
  const n = labels.length;
  const x = (i) => L + (n === 1 ? (W - L - R) / 2 : i * (W - L - R) / (n - 1));
  const y = (v) => T + (hi - v) * (H - T - B) / (hi - lo);
  const grid = ticks.map((v) => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#21262d"/>
    <text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${axisFmt(v)}</text>`).join("");
  const step = Math.ceil(n / Math.max(2, Math.min(12, Math.floor((W - 86) / 48))));
  const xl = labels.map((t, i) => i % step ? "" : `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${t}</text>`).join("");
  const lines = series.map((s) => {
    let d = "", pen = false;
    s.values.forEach((v, i) => {
      if (v == null) { pen = false; return; }
      d += `${pen ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`; pen = true;
    });
    const dots = s.values.map((v, i) => v == null ? "" : `<circle cx="${x(i)}" cy="${y(v)}" r="2.5" fill="${s.color}"><title>${s.name} · ${labels[i]}: ${tipFmt(v)}</title></circle>`).join("");
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width ?? 2}" ${s.dash ? `stroke-dasharray="${s.dash}"` : ""}/>${dots}`;
  }).join("");
  const zl = zero != null ? `<line x1="${L}" x2="${W - R}" y1="${y(zero)}" y2="${y(zero)}" stroke="#8b949e" stroke-dasharray="5 4"/>` : "";
  const legend = series.map((s) => `<span style="color:${s.color}">${!s.dash ? "━" : s.dash === "2 4" ? "┈" : "┅"}</span> ${s.name}`).join(" &nbsp; ");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${grid}${zl}${lines}${xl}</svg><div class="sub">${legend}</div>`;
}

function renderReplay({ data: d, src }) {
  const p = d.params, names = BUCKET_NAMES(p.bounds), s = d.summary, rp = d.replay;
  const rounds = d.rounds, labels = rounds.map((r) => r.window_utc[0].slice(11, 16));
  const agents = d.agents.map((a, i) => ({ ...a, color: PALETTE[i % PALETTE.length], sum: s.agents[a.agent],
    forecast_source: a.forecast_source ?? rounds[0]?.agents[a.agent]?.forecast_source }));
  const uniform = p.baseline_log_score_float;
  const card = (title, html, cls = "", id = "") =>
    `<section${id ? ` id="${id}"` : ""} class="card ${cls}"><h2>${title}</h2>${html}</section>`;
  const tierOf = (a) => a.tier ?? (a.model_type === "zk" ? "zk" : "commit-only");
  const isZk = (a) => tierOf(a) === "zk";
  const dashOf = (a) => isZk(a) ? null : tierOf(a) === "reproducible" ? "2 4" : "6 4";
  const repro = (a) => {
    const flags = rounds.map((r) => r.agents[a.agent]?.reproduced).filter((v) => v != null);
    return { checked: flags.length, failed: flags.filter((v) => v === false).length };
  };
  const tierBadge = (cls, title, zh, en) =>
    `<span class="badge ${cls}" title="${title}">${zh}<span class="en"><span class="sep"> · </span>${en}</span></span>`;
  const typeBadge = (a) => {
    const tier = tierOf(a);
    if (tier === "zk") return `<span class="badge zk" title="each reveal carries an EZKL proof the contract verified">zk proof</span>`;
    if (tier === "reproducible") {
      const { checked, failed } = repro(a), hash = a.model_hash ? short(a.model_hash) : "?";
      const how = `modelHash ${hash} registered onchain; every reveal re-run from the onchain features with the public weights at a pinned revision (python -m vol_agents.recompute) and matched bucket by bucket`;
      if (checked && !failed) return tierBadge("ok", `${how} · ${checked}/${checked} rounds reproduced`, "可复现-已核验", "reproducible·verified");
      return tierBadge("commit", how, "可复现", "reproducible") +
        (failed ? ` <span class="badge bad" title="${failed} of ${checked} rounds did not reproduce from the onchain features">reproduce failed</span>` : "");
    }
    return tierBadge("commit", "committed before the deadline; no proof of which model made it", "仅承诺", `commit-only · ${a.forecast_source ?? "?"}`);
  };
  document.querySelector("h1").textContent = `Verifiable AI Forecasts · ${rp.hours} h mainnet replay`;
  document.getElementById("subtitle").innerHTML =
    `${d.network} · fork block ${blockLink(d.fork_block)} · ${rp.start_utc} → ${rp.end_utc} · ` +
    `${s.settled} settled, ${s.voided ? `<span class="badge bad">${s.voided} voided</span>` : "0 voided"}`;

  const voidList = Object.entries(s.void_reasons).map(([k, v]) => `${v} × ${k}`).join(", ") || "none";
  const clOk = rp.chainlink_reports.filter((r) => r.ok).length;
  const overview = card("Replay", `<dl class="kv">
    <dt>Hours replayed</dt><dd>${rounds.length} consecutive rounds of ${p.n_segments} × ${p.delta_s} s</dd>
    <dt>Pool path</dt><dd>${rp.segments_replayed} five-minute segments set to mainnet's real mean tick</dd>
    <dt>Fork features = mainnet</dt><dd>${badge(s.features_match_mainnet, "all rounds", "mismatch")}</dd>
    <dt>Fork RV = mainnet</dt><dd>${badge(s.rv_matches_mainnet, "all rounds", "mismatch")}</dd>
    <dt>Chainlink reports</dt><dd>${clOk} / ${rp.chainlink_reports.length} real transmissions re-sent on the fork</dd>
    <dt>Voided</dt><dd>${voidList}</dd>
    <dt>Wall time</dt><dd>${d.elapsed_s != null ? `${Math.round(d.elapsed_s)} s` : "?"}</dd></dl>`);

  const counts = s.bucket_counts, maxC = Math.max(1, ...counts);
  const bucketCard = card("Winning buckets", `<div style="display:flex;gap:6px;align-items:flex-end;height:120px">
    ${counts.map((c, i) => `<div style="flex:1;text-align:center"><div class="sub">${c}</div>
      <div style="height:${c / maxC * 90}px;background:var(--win);opacity:.75;border-radius:4px 4px 0 0"></div></div>`).join("")}</div>
    <div class="buckets">${names.map((n, i) => `<div>#${i}<br>${n}</div>`).join("")}</div>
    <div class="sub" style="margin-top:8px">Bounds in tick², calibrated on training-period swaps only.</div>`);

  const cumulative = (vals) => { let acc = 0; return vals.map((v) => v == null ? null : (acc += v)); };
  const scoreOf = (r, a) => r.outcome.voided ? null : r.agents[a.agent]?.log_score_float ?? null;
  const excess = agents.map((a) => ({ name: a.agent, color: a.color, dash: dashOf(a),
    values: cumulative(rounds.map((r) => { const v = scoreOf(r, a); return v == null ? null : v - uniform; })) }));
  const excessCard = card("Cumulative log score minus uniform baseline (nats)",
    lineChart(excess, labels, { zero: 0 }) +
    `<div class="sub">Above the dashed zero line = the agent has, in total, put more probability on the outcome than a
    uniform 1/5 forecast (${uniform.toFixed(3)} per round). Voided rounds are not scored.
    Agent lines: solid = zk proof, dotted = reproducible, dashed = commit-only.</div>`, "wide");

  const W = Math.min(6, rounds.length);
  const rolling = (vals) => vals.map((_, i) => {
    const win = vals.slice(Math.max(0, i - W + 1), i + 1).filter((v) => v != null);
    return win.length ? win.reduce((x, y) => x + y, 0) / win.length : null;
  });
  const roll = agents.map((a) => ({ name: a.agent, color: a.color, dash: dashOf(a),
    values: rolling(rounds.map((r) => scoreOf(r, a))) }));
  const rollCard = card(`Rolling ${W}-round mean log score`, lineChart(roll, labels, { zero: uniform, max: 0 }) +
    `<div class="sub">Dashed line: uniform baseline ln(1/5).</div>`, "wide");

  const rvSeries = [{ name: "realized vol (tick²)", color: "#a371f7", values: rounds.map((r) => r.outcome.realized_vol ?? r.real_realized_vol) }];
  const rvCard = card("Realized volatility per round",
    lineChart(rvSeries, labels, { min: 0, tip: (v) => v.toFixed(0) }) +
    `<div class="sub">Bucket bounds ${p.bounds.join(" / ")} tick². RV from the contract's settle, equal to the mainnet recompute.</div>`, "wide");

  const fs = s.fee_strategies;
  let feeCard = "";
  if (fs && rounds.some((r) => r.fee)) {
    const fee = (k) => rounds.map((r) => r.fee?.[k] ?? null);
    const feeSeries = [
      { name: "fair LVR fee", color: "#e6edf3", width: 2.5, values: fee("fair_bps") },
      { name: "fixed 5 bps", color: "#8b949e", dash: "6 4", values: fee("fixed_bps") },
      { name: "prev-hour RV", color: "#ffa657", values: fee("prev_hour_bps") },
      { name: "forecast (on-chain)", color: "#56d4dd", values: fee("forecast_bps") },
    ];
    const strategies = [["fixed", "fixed 5 bps", "fixed"], ["prev_hour", "prev-hour RV", "prev_hour"],
                        ["forecast", "forecast (on-chain)", "forecast"]];
    const best = Math.min(...strategies.map(([k]) => fs.mae_bps[k]));
    const tiles = strategies.map(([k, name, meanKey], i) => {
      const mae = fs.mae_bps[k], win = mae === best;
      return `<div class="fee-tile${win ? " best" : ""}"><div class="sub"><span style="color:${feeSeries[i + 1].color}">${feeSeries[i + 1].dash ? "┅" : "━"}</span>
        ${name}</div><div><span class="fee-mae" data-mae="${k}">${mae.toFixed(2)}</span> <span class="sub">bps MAE</span>
        ${win ? `<span class="badge ok">lowest</span>` : ""}</div><div class="sub">mean ${fs.mean_bps[meanKey].toFixed(2)} bps</div></div>`;
    }).join("");
    const fallback = fs.equal_weight_fallback_rounds ? ` ${fs.equal_weight_fallback_rounds} of ${fs.rounds} rounds used the equal-weight fallback.` : "";
    feeCard = card("Consumer example · forecast-driven AMM fee vs fair LVR fee (bps)",
      lineChart(feeSeries, labels, { min: 0, tip: (v) => v.toFixed(2) }) +
      `<div class="fee-tiles"><div class="fee-tile"><div class="sub"><span style="color:#e6edf3">━</span> fair LVR fee</div>
        <div><span class="fee-mae">${fs.mean_bps.fair.toFixed(2)}</span> <span class="sub">bps mean</span></div>
        <div class="sub">reference</div></div>${tiles}</div>
      <div class="sub" style="margin-top:8px">Fair = LVR break-even fee σ²/8 × 2L√P ÷ the hour's real mainnet volume.
      The forecast fee is computed and recorded on-chain by VolFeeConsumer each round before startTime from the revealed,
      ERC-8004 reputation-weighted forecasts.${fallback} MAE against the fair fee over ${fs.rounds} rounds. Simulated: no real pool fee changes.</div>`,
      "wide", "fee-card");
  }

  const rewards = agents.map((a) => ({ name: a.agent, color: a.color, dash: dashOf(a),
    values: cumulative(rounds.map((r) => Number(BigInt(r.agents[a.agent]?.predictor_reward_wei ?? "0")) / 1e18)) }));
  const rewardCard = card("Cumulative predictor fee share (WETH)", lineChart(rewards, labels, { min: 0 }) +
    `<div class="sub">${p.predictor_share_bps / 100}% of each round's ${p.fee_bps / 100}% fee goes to forecasters above the uniform
    baseline, pro rata to their excess log score.</div>`, "wide");

  const tamper = Object.fromEntries(d.tamper_checks.map((t) => [t.agent, t]));
  const agentRows = agents.map((a) => {
    const m = a.sum, rep = m.erc8004, t = tamper[a.agent];
    const proves = rounds.map((r) => r.agents[a.agent]?.prove_seconds).filter((v) => v != null);
    const prove = proves.length ? (proves.reduce((x, y) => x + y, 0) / proves.length).toFixed(1) + " s" : "–";
    const repVal = Number(rep.summary_value) / 10 ** rep.summary_decimals;
    return `<tr><td><span style="color:${a.color}">●</span> <b class="nowrap">${a.agent}</b> ${typeBadge(a)}<div class="sub mono nowrap">${short(a.address)}</div></td>
      <td class="num">${m.rounds_scored}</td><td class="num"><b>${m.total_log_score.toFixed(3)}</b></td>
      <td class="num">${m.mean_log_score != null ? m.mean_log_score.toFixed(3) : "–"}</td>
      <td class="num">${m.beat_baseline_rounds}</td><td class="num">${eth(m.predictor_reward_wei)}</td>
      <td>${isZk(a) ? `${t ? badge(!t.tampered_output_verifies, "tampered proof rejected", "tamper accepted!") : ""}
        <div class="sub">prove ${prove} avg${t?.verify_proof_gas ? ` · verifyProof ${t.verify_proof_gas.toLocaleString()} gas` : ""}</div>`
        : tierOf(a) === "reproducible" ? (({ checked, failed }) => `${checked
          ? badge(!failed, `${checked}/${checked} reveals recomputed`, `${failed} of ${checked} not reproduced`) : ""}
        <div class="sub">no proof; public weights, model <span class="mono">${a.model_hash ? short(a.model_hash) : "?"}</span></div>`)(repro(a))
        : `<div class="sub">no proof; reveal checked against commit only</div>`}</td>
      <td class="nowrap">agentId <b>${a.agent_id}</b><div class="sub">getSummary: ${rep.count} × ${repVal.toFixed(3)}<br>
        <span class="mono">${rep.tag1} / ${rep.tag2}</span></div></td></tr>`;
  }).join("");
  const agentsCard = card("Agents over the replay", scrollTable(`<tr><th>Agent</th><th class="num">Scored</th>
    <th class="num">Σ ln p</th><th class="num">Mean</th><th class="num">Rounds &gt; baseline</th><th class="num">Fee share (WETH)</th>
    <th>Verification</th><th>ERC-8004 ${link(d.contracts.erc8004_reputation)}</th></tr>
    <tr><td class="sub">uniform baseline</td><td class="num">${s.settled}</td><td class="num">${s.uniform_total_log_score.toFixed(3)}</td>
    <td class="num">${uniform.toFixed(3)}</td><td></td><td></td><td></td><td></td></tr>${agentRows}`, 980), "wide");

  const roundRows = rounds.map((r) => {
    const o = r.outcome, m = r.mainnet;
    const scores = agents.map((a) => {
      const v = scoreOf(r, a);
      const miss = r.agents[a.agent]?.reproduced === false
        ? ` <span class="badge bad" title="this reveal did not reproduce from the onchain features">✗</span>` : "";
      return `<td class="num" style="color:${v == null ? "var(--muted)" : v > uniform ? "var(--ok)" : "var(--bad)"}">${v == null ? "–" : v.toFixed(2)}${miss}</td>`;
    }).join("");
    return `<tr><td>#${r.id}</td><td class="mono nowrap">${r.window_utc[0].slice(5, 16)}</td>
      <td class="nowrap">${blockLink(m.block_from)}–${blockLink(m.block_to)}</td>
      <td class="num">${m.swap_count}${m.last_swap_tx ? `<div class="sub">last ${txLink(m.last_swap_tx)}</div>` : ""}</td>
      <td class="num">${o.realized_vol ?? r.real_realized_vol} ${badge(r.rv_matches_mainnet, "=", "≠")}</td>
      <td>${o.voided ? `<span class="badge bad" title="${o.void_reason}">void</span><div class="sub">${o.void_reason}</div>` : `#${o.winning_bucket}`}</td>
      <td class="num">${r.chainlink?.feed_age_s ?? "–"} s<div class="sub">${r.chainlink?.deviation_bps ?? "–"} bps</div></td>
      ${scores}<td class="num">${o.gas_used?.toLocaleString() ?? "–"}</td></tr>`;
  }).join("");
  const roundsCard = card("Rounds · mainnet blocks, swaps and scores", `${scrollTable(`<tr><th>Round</th><th>Window (UTC)</th>
    <th>Mainnet blocks</th><th class="num">Swaps</th><th class="num">RV vs mainnet</th><th>Outcome</th><th class="num">Feed age / dev</th>
    ${agents.map((a) => `<th class="num" style="color:${a.color}">${a.agent.replace("agent-", "")}</th>`).join("")}<th class="num">Settle gas</th></tr>
    ${roundRows}`, 1000)}
    <div class="sub" style="margin-top:8px">Block and transaction links point at Ethereum mainnet: the window's real blocks and its
    last pool swap. The market itself lives only on the local fork. Green score = above the uniform baseline.</div>`, "wide");

  const c = d.contracts;
  const clRows = rp.chainlink_reports.map((x) => `<tr><td>${txLink(x.mainnet_tx)}</td><td>${blockLink(x.mainnet_block)}</td>
    <td class="mono">${fmtTime(x.mainnet_updated_at)}</td><td class="num">$${x.answer_usd.toFixed(2)}</td>
    <td>${badge(x.ok, "replayed", "failed")}</td></tr>`).join("");
  const clCard = card("Chainlink ETH/USD reports replayed", `<div class="table-scroll" style="max-height:320px;overflow-y:auto">
    <table style="min-width:560px"><tr><th>Mainnet tx</th><th>Block</th><th>Updated</th><th class="num">Answer</th><th></th></tr>${clRows}</table></div>
    <div class="sub" style="margin-top:8px">Each real transmission is re-sent on the fork by its original transmitter at its
    original timestamp, so the feed's answer and age at every settle are mainnet's.</div>`, "wide");
  const contractsCard = card("Contracts", `<dl class="kv">
    <dt>ERC-8004 Identity</dt><dd>${link(c.erc8004_identity)}</dd>
    <dt>ERC-8004 Reputation</dt><dd>${link(c.erc8004_reputation)}</dd>
    <dt>Chainlink ETH/USD</dt><dd>${link(c.chainlink_feed)}</dd>
    <dt>Uniswap V3 pool</dt><dd>${link(c.pool)}</dd>
    <dt>Settlement token</dt><dd>${link(c.settlement_token)} WETH</dd>
    <dt>VolMarket</dt><dd class="mono">${short(c.market)} (deployed on the fork)</dd></dl>`);

  const app = document.getElementById("app");
  app.style.gridTemplateColumns = "repeat(auto-fit, minmax(min(400px, 100%), 1fr))";
  app.innerHTML = overview + bucketCard + contractsCard + excessCard + rollCard +
    agentsCard + rewardCard + rvCard + feeCard + roundsCard + clCard;
  document.getElementById("source").textContent =
    `Data: ${src} · generated ${d.generated_at ? new Date(d.generated_at * 1000).toISOString() : "?"} · read-only view, no wallet, no writes.`;
}

load().then((x) => {
  const draw = x.data.schema === "vol-replay/v1" ? renderReplay : render;
  draw(x);
  const w = Math.min(1200, measureChartWidth());
  if (w !== chartWidth) { chartWidth = w; draw(x); }
}).catch((e) => {
  document.getElementById("subtitle").textContent = "";
  document.getElementById("app").innerHTML = `<div id="error">${e.message}</div>`;
});
</script>
</body>
</html>
