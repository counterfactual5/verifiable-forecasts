// Explorer-style log of every on-chain action the replay records, newest first; only mainnet rows get an Etherscan link.
const FEED_SHOWN = 12;
function feedRows(d) {
  const rows = [], p = d.params;
  const tierOf = (a) => a.tier ?? (a.model_type === "zk" ? "zk" : "commit-only");
  const tierBy = Object.fromEntries(d.agents.map((a, i) => [a.agent, { tier: tierOf(a), color: PALETTE[i % PALETTE.length] }]));
  for (const c of d.replay.chainlink_reports ?? []) {
    if (c.mainnet_block == null) continue;
    const h = d.rounds.findIndex((r) => c.mainnet_updated_at < r.end);
    rows.push({ t: c.mainnet_updated_at, h, net: "mainnet", block: blockLink(c.mainnet_block), act: "Chainlink ETH/USD transmit",
                who: `$${c.answer_usd.toFixed(2)}`, gas: "—", tx: c.mainnet_tx ? txLink(c.mainnet_tx) : "—" });
  }
  d.rounds.forEach((r, h) => {
    for (const [name, ra] of Object.entries(r.agents)) {
      const k = tierBy[name] ?? { tier: "commit-only", color: "#8a8170" };
      rows.push({ t: r.start - p.reveal_lead_s, h, net: "fork", block: "—", act: k.tier === "zk" ? "VolMarket.reveal + verifyProof" : "VolMarket.reveal",
                  who: `<span class="who"><i style="background:${k.color}"></i>${name.replace("agent-", "")}</span>`,
                  gas: ra.reveal_gas?.toLocaleString() ?? "—", tx: "fork" });
    }
    const fo = r.fee?.onchain;
    if (fo?.block != null) rows.push({ t: fo.timestamp ?? r.start, h, net: "fork", block: fo.block.toLocaleString(), act: "VolFeeConsumer.setFee",
      who: `${(fo.fee_pips / 100).toFixed(2)} bps`, gas: "—", tx: "fork" });
    if (r.mainnet) rows.push({ t: r.end - 1, h, net: "mainnet", block: `${blockLink(r.mainnet.block_from)}–${blockLink(r.mainnet.block_to)}`,
      act: `Uniswap V3 swaps × ${r.mainnet.swap_count}`, who: "pool", gas: "—", tx: r.mainnet.last_swap_tx ? txLink(r.mainnet.last_swap_tx) : "—" });
    const o = r.outcome;
    if (o.settle_block != null) rows.push({ t: r.end, h, net: "fork", block: o.settle_block.toLocaleString(),
      act: o.voided ? "VolMarket.settle（作废）" : `VolMarket.settle → 档位 #${o.winning_bucket}`, who: `${o.erc8004_feedback_logs ?? 0} × ERC-8004 feedback`,
      gas: o.gas_used?.toLocaleString() ?? "—", tx: "fork" });
  });
  return rows.sort((a, b) => b.t - a.t);
}

// One column per hour, one row per bucket (#4 on top); cell alpha = forecast probability, ringed dot = the settled bucket.
function heatmap(d) {
  const rounds = d.rounds, N = rounds.length, names = BUCKET_NAMES(d.params.bounds);
  const mix = rounds.map((r) => r.fee?.mirror?.mix_probs ?? null);
  const strips = (mix.every(Boolean) ? [{ name: "声誉加权混合", sub: "AMM 读到的", color: "#1b1a17", probs: mix }] : [])
    .concat(d.agents.map((a, i) => ({ name: a.agent.replace("agent-", ""), color: PALETTE[i % PALETTE.length],
      probs: rounds.map((r) => r.agents[a.agent]?.probs ?? null) })));
  const strip = (s) => {
    const cells = [];
    rounds.forEach((r, h) => {
      const win = r.outcome.voided ? -1 : r.outcome.winning_bucket, ps = s.probs[h], hm = r.window_utc[0].slice(11, 16);
      for (let k = 4; k >= 0; k--) {
        const v = ps?.[k];
        cells.push(`<i data-h="${h}" class="${k === win ? "w" : ""}" style="--p:${v == null ? 0 : Math.min(1, v / 0.6).toFixed(3)}"
          data-tip="${attr(tipLines(`${hm} UTC · ${s.name}`, [`#${k} ${names[k]}${k === win ? "（实际）" : ""}: ${v == null ? "—" : v.toFixed(3)}`]))}"></i>`);
      }
    });
    return `<div class="hm-row"><span class="hm-name"><b style="--c:${s.color}"></b>${s.name}${s.sub ? `<small>${s.sub}</small>` : ""}</span>
      <div class="hm" style="--n:${N}">${cells.join("")}</div></div>`;
  };
  return `<div class="heat" id="heat" role="img" style="--n:${N}; --h:${STATE.round}"
      aria-label="谁比瞎猜更准？ heatmap of forecast probability per bucket and hour versus the settled bucket, ${strips.length} strips, ${N} rounds">
    <div class="hm-title">预测分布 vs 实际 <span>每列一小时 · 每行一个档位（上 #4 高波动 → 下 #0）· 颜色越深 = 给的概率越高 · <i class="hm-dot"></i> = 实际落档 · 点击列切换轮次</span></div>
    ${strips.map(strip).join("")}
    <div class="hm-row hm-axis"><span class="hm-name"></span><div class="hm-ax"><span>${rounds[0].window_utc[0].slice(11, 16)}</span>
      <span>${rounds[Math.floor(N / 2)].window_utc[0].slice(11, 16)}</span><span>${rounds[N - 1].window_utc[0].slice(11, 16)}</span></div></div></div>`;
}
// v2 replacement for the heat strip: one compact fan per forecaster (consensus first) on a shared hour axis and a
// shared log RV scale, so rows compare by eye; each row ends with its interval coverage.
function smallMultiples(d, agents) {
  const rounds = d.rounds, n = rounds.length, band = isV2(d) ? "80%" : "90%";
  const fmt = (v) => (v >= 100 ? v.toFixed(0) : v.toFixed(1));
  const hours = rounds.map((r) => ({ t: r.window_utc[0].slice(11, 16), v: r.outcome?.realized_vol ?? r.real_realized_vol, settled: !r.outcome?.voided,
    c: consensusQ(d, r).q, q: Object.fromEntries(agents.map((a) => [a.agent, forecastQ(d, r.agents[a.agent])])) }));
  const rows = [{ id: "consensus", name: "consensus", sub: "reputation-weighted", color: "var(--accent)", med: "var(--vermil)", real: "#1b1a17", get: (x) => x.c }]
    .concat(agents.map((a) => ({ id: a.agent, name: a.agent.replace("agent-", ""), color: a.color, med: a.color, real: "#a8a194",
      loss: d.summary.agents?.[a.agent]?.mean_pinball_loss ?? null, get: (x) => x.q[a.agent] })));
  const vals = hours.flatMap((x) => [...(x.v != null ? [Math.max(1, x.v)] : []), ...rows.flatMap((r) => r.get(x) ?? [])]);
  const lo = Math.min(...vals) / 1.15, hi = Math.max(...vals) * 1.15;
  const narrow = chartWidth < 600, W = narrow ? Math.max(260, chartWidth) : Math.max(300, Math.min(1200, chartWidth) - 300);
  const H = narrow ? 44 : 58, P = 6, gap = (W - 2 * P) / Math.max(1, n - 1);
  const x = (i) => P + (n === 1 ? (W - 2 * P) / 2 : i * gap), y = (v) => 3 + (Math.log(hi) - Math.log(Math.max(lo, v))) / (Math.log(hi) - Math.log(lo)) * (H - 6);
  const xy = (i, v) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`;
  const trace = (get) => { let s = "", pen = false; hours.forEach((h, i) => { const v = get(h); if (v == null) { pen = false; return; } s += `${pen ? "L" : "M"}${xy(i, v)}`; pen = true; }); return s; };
  const area = (get, a, z) => {
    const runs = [];
    hours.forEach((h, i) => { const q = get(h); if (!q) runs.push(null); else if (runs.at(-1)) runs.at(-1).push([i, q]); else runs.push([[i, q]]); });
    return runs.filter(Boolean).map((run) => run.map(([i, q], j) => `${j ? "L" : "M"}${xy(i, q[z])}`).join("")
      + run.slice().reverse().map(([i, q]) => `L${xy(i, q[a])}`).join("") + "Z").join("");
  };
  const real = trace((h) => (h.v == null ? null : Math.max(1, h.v)));
  const outside = (h, q) => h.settled && h.v != null && q && (Math.max(1, h.v) < q[0] || Math.max(1, h.v) > q[4]);
  const row = (r) => {
    const c = coverage(hours, r.get);
    const dots = hours.map((h, i) => {
      if (h.v == null) return "";
      const out = outside(h, r.get(h)), rad = (narrow ? 1.6 : 2) * (out ? 1.6 : 1);
      return `<circle${out ? ` class="sm-out"` : ""} cx="${x(i).toFixed(1)}" cy="${y(Math.max(1, h.v)).toFixed(1)}" r="${rad}" fill="${out ? "#d8431b" : r.real}"/>`;
    }).join("");
    const xs = hours.filter((h) => h.settled && r.get(h));
    const width = xs.length ? Math.exp(xs.reduce((s, h) => s + Math.log(r.get(h)[4]) - Math.log(r.get(h)[0]), 0) / xs.length) : null;
    const hits = hours.map((h, i) => {
      const q = r.get(h);
      const tip = tipLines(`${h.t} UTC · ${r.name}`, [`realized RV: ${h.v ?? "—"}${h.v != null ? " tick²" : ""}${h.settled ? "" : " (voided)"}${outside(h, q) ? ` · outside ${band}` : ""}`,
        ...(q ? [`median: ${fmt(q[2])} tick²`, `50%: ${fmt(q[1])}–${fmt(q[3])} tick²`, `${band}: ${fmt(q[0])}–${fmt(q[4])} tick²`] : ["no forecast"])]);
      return `<rect class="sm-hit" data-h="${i}" x="${(x(i) - gap / 2).toFixed(1)}" y="0" width="${gap.toFixed(1)}" height="${H}" fill="transparent" data-tip="${attr(tip)}"/>`;
    }).join("");
    return `<div class="sm-row" data-row="${r.id}"><span class="sm-name"><i style="background:${r.color}"></i>${r.name}${r.sub ? `<small>${r.sub}</small>` : ""}</span>
      <svg class="sm-svg" viewBox="0 0 ${W} ${H}" width="100%" data-lo="${lo}" data-hi="${hi}" data-x0="${P}" data-gap="${gap}" aria-hidden="true">
        <rect class="sm-cur" x="${(x(STATE.round) - gap / 2).toFixed(1)}" y="0" width="${gap.toFixed(1)}" height="${H}"/>
        <path class="nc-band-wide" d="${area(r.get, 0, 4)}" fill="${r.color}" opacity=".16"/>
        <path class="nc-band-50" d="${area(r.get, 1, 3)}" fill="${r.color}" opacity=".32"/>
        <path class="sm-med" d="${trace((h) => r.get(h)?.[2])}" fill="none" stroke="${r.med}" stroke-width="1.4"${r.id === "consensus" ? ` stroke-dasharray="5 3"` : ""}/>
        <path class="sm-real" d="${real}" fill="none" stroke="${r.real}" stroke-width="${r.id === "consensus" ? 1.4 : 1}"/>${dots}${hits}</svg>
      <span class="sm-stats"><span class="sm-cov" data-cov="${r.id}" data-n="${c.n}" data-wide="${c.wide}" data-mid="${c.mid}">${band}: <b>${c.wide}/${c.n}</b> · 50%: <b>${c.mid}/${c.n}</b></span>
        <span class="sm-w" data-width="${width ?? ""}"><b>${width == null ? "—" : `×${width.toFixed(1)}`}</b> width</span>
        <span class="sm-l" data-loss="${r.loss ?? ""}">loss <b>${r.loss == null ? "—" : r.loss.toFixed(3)}</b></span></span></div>`;
  };
  return `<div class="smult" id="heat" role="img" aria-label="${attr(`Small multiples: consensus and each agent's median, 50% and ${band} intervals against realized RV, ${n} rounds, shared log scale`)}">
    <div class="sm-title">预测区间 vs 实际 <span>每行一个预测者（第一行 = 声誉加权共识），同一时间轴、同一对数 RV 轴；淡色 = ${band} 区间，深色 = 50% 区间，彩线 = 中位数，黑线 = 链上实际 RV；右侧 = 覆盖率 · 点击列切换轮次</span></div>
    <div class="sm-row sm-head"><span></span><span></span><span class="sm-stats"><span>coverage</span><span>width (q90/q10, ×)</span><span>loss (mean pinball, ln RV)</span></span></div>
    ${rows.map(row).join("")}
    <div class="sm-row sm-axis"><span class="sm-name"></span><div class="hm-ax"><span>${hours[0].t}</span><span>${hours[Math.floor(n / 2)].t}</span><span>${hours[n - 1].t}</span></div><span></span></div>
    <div class="sub">朱红点 = 实际值落在 ${band} 区间外；覆盖率要和区间宽度一起看（区间越宽越容易覆盖）；loss 越低越准。</div></div>`;
}

const FLOW = { parts: [], canvas: null, ctx: null, w: 0, h: 0, raf: 0, last: 0, acc: 0, pulse: 0, radii: [] };
const FONT_MONO = '"SF Mono", ui-monospace, Menlo, Consolas, monospace';
const FONT_SERIF = '"Iowan Old Style", Charter, "Songti SC", Georgia, serif';

function flowGeom(w, h, n) {
  const narrow = w < 560;
  const ax = narrow ? Math.max(96, w * 0.28) : Math.max(120, w * 0.17);
  const bx = w * (narrow ? 0.6 : 0.58), bw = narrow ? 58 : 92, bh = Math.min(48, (h - 40) / 5 - 10);
  const fx = w - (narrow ? 34 : 64), fy = h / 2, fr = narrow ? 20 : 28;
  const ay = (i) => 30 + (i + 0.5) * (h - 60) / n;
  const by = (k) => 22 + (k + 0.5) * (h - 44) / 5;
  return { narrow, ax, bx, bw, bh, fx, fy, fr, ay, by };
}

TIP_PROVIDERS.push((e) => {
  if (e.target.id !== "flow" || !STATE.model) return null;
  const c = e.target, b = c.getBoundingClientRect(), px = e.clientX - b.left, py = e.clientY - b.top;
  const m = STATE.model, r = m.rounds[STATE.round], g = flowGeom(c.clientWidth, c.clientHeight, r.agents.length);
  const pct = (p) => `${(p * 100).toFixed(1)}%`, head = `${r.label} UTC · round #${r.h}`;
  const k = m.names.findIndex((_, k) => Math.abs(px - g.bx) <= g.bw / 2 && Math.abs(py - g.by(k)) <= g.bh / 2);
  if (k >= 0) {
    const mix = r.agents.reduce((s, a) => s + a.share * a.probs[k], 0);
    return tipLines(`${head} · #${k} ${m.names[k]} tick²${STATE.data && isV2(STATE.data) ? " · derived from quantiles, for the betting view" : ""}`, [...r.agents.map((a) => `${a.name}: ${pct(a.probs[k])}`),
      `weighted mix: ${pct(mix)}`, ...(k === r.win ? [`realized RV (settled here): ${r.rv} tick²`] : [])]);
  }
  const i = r.agents.findIndex((_, i) => Math.hypot(px - g.ax, py - g.ay(i)) <= Math.max(12, FLOW.radii[i] ?? 0) + 4);
  if (i >= 0) {
    const a = r.agents[i];
    return tipLines(`${head} · ${a.name}`, [`weight share: ${pct(a.share)}`, `cumulative score: ${a.cum >= 0 ? "+" : ""}${a.cum.toFixed(3)}`,
      ...m.names.map((nm, k) => `#${k} ${nm}: ${pct(a.probs[k])}`)]);
  }
  if (r.fee != null && Math.hypot(px - g.fx, py - g.fy) <= g.fr + 6)
    return tipLines(`${head} · AMM fee`, [`forecast: ${r.fee.toFixed(2)} bps`, ...(r.fair != null ? [`hindsight fair fee: ${r.fair.toFixed(2)} bps`] : [])]);
  return null;
});

function bez(p0, p1, p2, p3, t) {
  const s = 1 - t;
  return s * s * s * p0 + 3 * s * s * t * p1 + 3 * s * t * t * p2 + t * t * t * p3;
}

function flowSetup() {
  const c = document.getElementById("flow");
  if (!c) return false;
  const w = c.clientWidth, h = c.clientHeight, dpr = Math.min(2, devicePixelRatio || 1);
  if (!w) return false;
  if (c !== FLOW.canvas || w !== FLOW.w || h !== FLOW.h) {
    FLOW.canvas = c; FLOW.w = w; FLOW.h = h;
    c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
    FLOW.ctx = c.getContext("2d");
    FLOW.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    FLOW.ctx.fillStyle = "#fbf8f1"; FLOW.ctx.fillRect(0, 0, w, h);
  }
  return true;
}

function flowFrame(now) {
  FLOW.raf = 0;
  if (document.hidden || !STATE.model || !flowSetup()) return;
  const dt = Math.min(0.05, FLOW.last ? (now - FLOW.last) / 1000 : 0.016);
  FLOW.last = now;
  const ctx = FLOW.ctx, w = FLOW.w, h = FLOW.h, m = STATE.model, r = m.rounds[STATE.round];
  const g = flowGeom(w, h, r.agents.length);
  ctx.fillStyle = calm ? "#fbf8f1" : "rgba(251,248,241,0.3)";
  ctx.fillRect(0, 0, w, h);

  const cums = r.agents.map((a) => a.cum), lo = Math.min(...cums), hi = Math.max(...cums);
  r.agents.forEach((a, i) => {
    const target = (g.narrow ? 6 : 8) + (g.narrow ? 8 : 12) * (hi > lo ? (a.cum - lo) / (hi - lo) : 0.5);
    FLOW.radii[i] = FLOW.radii[i] == null || calm ? target : FLOW.radii[i] + (target - FLOW.radii[i]) * Math.min(1, dt * 4);
  });
  const ax0 = (i) => g.ax + FLOW.radii[i], bl = g.bx - g.bw / 2, br = g.bx + g.bw / 2;
  const seg1 = (i, k, t, off) => {
    const mx = (ax0(i) + bl) / 2;
    return [bez(ax0(i), mx, mx, bl, t), bez(g.ay(i), g.ay(i) + off, g.by(k) + off, g.by(k), t)];
  };
  const seg2 = (k, t, off) => {
    const mx = (br + g.fx - g.fr) / 2;
    return [bez(br, mx, mx, g.fx - g.fr, t), bez(g.by(k), g.by(k) + off, g.fy + off * 0.4, g.fy, t)];
  };

  // Ink guide paths: width follows probability × reputation share.
  ctx.lineCap = "round";
  r.agents.forEach((a, i) => a.probs.forEach((p, k) => {
    ctx.beginPath();
    for (let s = 0; s <= 24; s++) { const [x, y] = seg1(i, k, s / 24, 0); s ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.strokeStyle = `rgba(27,26,23,${(0.05 + 0.5 * p * a.share).toFixed(3)})`;
    ctx.lineWidth = calm ? 1 + 14 * p * a.share : 0.6 + 6 * p * a.share;
    ctx.stroke();
  }));
  const mix = [0, 1, 2, 3, 4].map((k) => r.agents.reduce((x, a) => x + a.share * a.probs[k], 0));
  mix.forEach((p, k) => {
    ctx.beginPath();
    for (let s = 0; s <= 24; s++) { const [x, y] = seg2(k, s / 24, 0); s ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.strokeStyle = `rgba(29,63,196,${(0.08 + 0.5 * p).toFixed(3)})`;
    ctx.lineWidth = calm ? 1 + 12 * p : 0.8 + 5 * p;
    ctx.stroke();
  });

  if (!calm) {
    const cap = g.narrow ? 170 : 300, rate = g.narrow ? 45 : 80;
    FLOW.acc += dt * rate;
    while (FLOW.acc >= 1 && FLOW.parts.length < cap) {
      FLOW.acc -= 1;
      let u = Math.random(), i = 0;
      while (i < r.agents.length - 1 && (u -= r.agents[i].share) > 0) i++;
      const a = r.agents[i];
      let v = Math.random() * a.probs.reduce((x, y) => x + y, 0), k = 0;
      while (k < 4 && (v -= a.probs[k]) > 0) k++;
      FLOW.parts.push({ i, k, t: 0, sp: 0.5 + Math.random() * 0.25, off: (Math.random() - 0.5) * 16, color: a.color, win: k === r.win });
    }
    if (FLOW.acc > 1) FLOW.acc = 1;
    const alive = [];
    for (const q of FLOW.parts) {
      const before = q.t;
      q.t += dt * q.sp;
      if (before < 1 && q.t >= 1 && q.win) FLOW.pulse = 1;
      if (q.t >= 2 || q.i >= r.agents.length) continue;
      const [x, y] = q.t < 1 ? seg1(q.i, q.k, q.t, q.off) : seg2(q.k, q.t - 1, q.off);
      ctx.beginPath();
      ctx.arc(x, y, q.t < 1 ? 2.6 : 2.2, 0, 7);
      ctx.fillStyle = q.t < 1 ? q.color : q.win ? "#a371f7" : "#1d3fc4";
      ctx.fill();
      alive.push(q);
    }
    FLOW.parts = alive;
    FLOW.pulse = Math.max(0, FLOW.pulse - dt * 1.6);
  }

  // Buckets.
  ctx.textBaseline = "middle";
  m.names.forEach((nm, k) => {
    const y = g.by(k), win = k === r.win;
    if (win && FLOW.pulse > 0) {
      ctx.strokeStyle = `rgba(163,113,247,${FLOW.pulse.toFixed(3)})`; ctx.lineWidth = 3;
      const e = 10 * (1 - FLOW.pulse);
      ctx.strokeRect(g.bx - g.bw / 2 - e, y - g.bh / 2 - e, g.bw + 2 * e, g.bh + 2 * e);
    }
    ctx.fillStyle = win ? "#a371f7" : "#f2ecdf";
    ctx.strokeStyle = "#1b1a17"; ctx.lineWidth = win ? 2 : 1;
    ctx.beginPath(); ctx.roundRect(g.bx - g.bw / 2, y - g.bh / 2, g.bw, g.bh, 6); ctx.fill(); ctx.stroke();
    ctx.fillStyle = win ? "#ffffff" : "#1b1a17";
    ctx.textAlign = "center";
    ctx.font = `700 ${g.narrow ? 11 : 13}px ${FONT_MONO}`;
    ctx.fillText(`#${k}`, g.bx, y - (g.narrow ? 7 : 8));
    ctx.font = `${g.narrow ? 9.5 : 11}px ${FONT_MONO}`;
    ctx.fillText(nm, g.bx, y + (g.narrow ? 7 : 9));
    if (win && !g.narrow) {
      ctx.textAlign = "left"; ctx.fillStyle = "#6b3fc4"; ctx.font = `700 11px ${FONT_MONO}`;
      ctx.fillText(`← RV ${r.rv}`, br + 6, y - g.bh / 2 - 6);
    }
  });

  // Agents.
  r.agents.forEach((a, i) => {
    const y = g.ay(i), rad = FLOW.radii[i];
    ctx.beginPath(); ctx.arc(g.ax, y, rad, 0, 7);
    ctx.fillStyle = a.color; ctx.fill();
    ctx.strokeStyle = "#1b1a17"; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.textAlign = "right"; ctx.fillStyle = "#1b1a17";
    ctx.font = `600 ${g.narrow ? 10.5 : 12.5}px ${FONT_MONO}`;
    ctx.fillText(g.narrow ? a.name.slice(0, 9) : a.name, g.ax - rad - 7, y - 7);
    ctx.font = `${g.narrow ? 9.5 : 11}px ${FONT_MONO}`;
    ctx.fillStyle = a.cum >= 0 ? "#1d3fc4" : "#c4291c";
    ctx.fillText(`${a.cum >= 0 ? "+" : ""}${a.cum.toFixed(2)}`, g.ax - rad - 7, y + 8);
  });

  // AMM fee node.
  ctx.beginPath(); ctx.arc(g.fx, g.fy, g.fr, 0, 7);
  ctx.fillStyle = "#1d3fc4"; ctx.fill(); ctx.strokeStyle = "#1b1a17"; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = "#ffffff"; ctx.textAlign = "center"; ctx.font = `700 ${g.narrow ? 10 : 12}px ${FONT_MONO}`;
  ctx.fillText("AMM", g.fx, g.fy);
  ctx.fillStyle = "#1b1a17";
  if (r.fee != null) {
    ctx.font = `700 ${g.narrow ? 15 : 20}px ${FONT_SERIF}`;
    ctx.fillText(`${r.fee.toFixed(2)} bps`, g.fx - (g.narrow ? 8 : 0), g.fy + g.fr + (g.narrow ? 14 : 18));
    ctx.font = `${g.narrow ? 9.5 : 11}px ${FONT_MONO}`;
    ctx.fillStyle = "#57524a";
    ctx.textAlign = "right";
    const rx = g.fx + g.fr + (g.narrow ? 10 : 30), ry = g.fy + g.fr + (g.narrow ? 30 : 37);
    if (g.narrow) {
      ctx.fillText("hindsight fair fee", rx, ry);
      ctx.fillText(r.fair.toFixed(2), rx, ry + 12);
    } else ctx.fillText(`hindsight fair fee ${r.fair.toFixed(2)}`, rx, ry);
    ctx.textAlign = "center";
  }
  ctx.fillStyle = "#57524a"; ctx.font = `${g.narrow ? 9.5 : 11}px ${FONT_MONO}`;
  ctx.fillText("fee", g.fx, g.fy - g.fr - 10);

  if (!calm) FLOW.raf = requestAnimationFrame(flowFrame);
}

    </div>${zkModels}<p class="tiers-rule">所有档共用（已实现）：提交后未揭示的轮次按本轮最差可揭示损失记入 ERC-8004 声誉和累计超额；三档分成规则相同，档位只标注出处，权重由消费方决定。ForecasterBond 合约已实现押金、未揭示罚没与挑战罚没（挑战由指定仲裁方裁决，需信任仲裁方）；本演示未启用押金门槛。详见 docs/ARCHITECTURE.md 第 9 节。</p></section>`;
}

load().then((x) => {
  adaptReplay(x.data);
  if (x.live) adaptReplay(x.live.data);
  const draw = REPLAY_SCHEMAS.includes(x.data.schema) ? renderReplay : render;
  if (!calm) document.body.classList.add("intro");
  draw(x);
  const fit = () => {
    // A card not laid out yet measures 0 or less; the nowcast forecast column goes negative below ~70.
    const w = Math.max(280, Math.min(1200, measureChartWidth()));
    if (w !== chartWidth) { chartWidth = w; draw(x); }
    markScrollHints();
  };
  fit();
  chartHover(document.getElementById("app"));
  setTimeout(() => document.body.classList.remove("intro"), 2600);
  // Redrawing rebuilds #app, so height-only changes (mobile URL bar) must not trigger it.
  let pending = 0;
  addEventListener("resize", () => {
    if (!pending) pending = requestAnimationFrame(() => { pending = 0; fit(); });
  });
}).catch((e) => {
  document.getElementById("subtitle").textContent = "";
  const box = document.createElement("div");
  box.className = "load-failed";
  box.setAttribute("role", "alert");
  const lead = document.createElement("div");
  lead.className = "sub";
  lead.textContent = "数据加载失败";
  const err = document.createElement("div");
  err.id = "error";
  err.textContent = e.message;
  box.append(lead, err);
  if (new URLSearchParams(location.search).get("data")) {
    const back = document.createElement("a");
    back.href = location.pathname + location.hash;
    back.textContent = "打开默认数据";
    box.append(back);
  }
  document.getElementById("app").replaceChildren(box);
});
</script>
