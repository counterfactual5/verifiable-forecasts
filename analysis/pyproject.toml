[project]
name = "vol-analysis"
version = "0.1.0"
description = "Offline analysis for the vol market: fetch Uniswap V3 Swap events, recompute the contract's realized-vol caliber, and calibrate the bucket bounds VolMarket.createRound consumes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
