[project]
name = "basefee-analysis"
version = "0.1.0"
description = "Offline analysis for the verifiable-forecasts: fetch mainnet base fee history, calibrate the sampling window and bucket bounds, and emit the parameters the contract and the forecasters consume."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
