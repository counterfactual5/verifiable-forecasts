# Live dashboard, static and read-only. Matches only requests addressed to the bare IP; every path
# outside /vf/ keeps that host's previous answer (redirect to https), so other sites are unaffected.
server {
    listen 80;
    server_name 198.11.181.13;

    location = /vf/ {
        return 302 /vf/dashboard/index.html?data=live-replay.json;
    }
    location /vf/dashboard/ {
        alias /opt/verifiable-forecasts/dashboard/;
        add_header Cache-Control "no-cache" always;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
