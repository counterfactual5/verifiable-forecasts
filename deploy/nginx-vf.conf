# Live dashboard, static and read-only. Its own server blocks only: other sites are unaffected.
# verifiable.llm.christmas sits behind Cloudflare (proxied, SSL mode Full); VF_CERT is replaced by
# deploy/push.sh with this host's own Let's Encrypt lineage once issued, else the llm.christmas one.
server {
    listen 80;
    listen [::]:80;
    server_name verifiable.llm.christmas;

    location /.well-known/acme-challenge/ {
        root /var/www/vf-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name verifiable.llm.christmas;

    ssl_certificate /etc/letsencrypt/live/VF_CERT/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/VF_CERT/privkey.pem;

    location /.well-known/acme-challenge/ {
        root /var/www/vf-acme;
    }
    # The page at / loads live-replay.json relative to itself, so its data files sit at the root too.
    location = / {
        root /opt/verifiable-forecasts/dashboard;
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }
    location ~ ^/(live-replay|sample-replay|sample-round)\.json$ {
        root /opt/verifiable-forecasts/dashboard;
        add_header Cache-Control "no-cache" always;
    }
    location /dashboard/ {
        alias /opt/verifiable-forecasts/dashboard/;
        add_header Cache-Control "no-cache" always;
    }
    location / {
        return 404;
    }
}

# Fallback without DNS: http://198.11.181.13/vf/ (port 80 only; every other path on the bare IP
# keeps its previous answer, a redirect to https).
server {
    listen 80;
    server_name 198.11.181.13;

    location = /vf/ {
        return 302 /vf/dashboard/index.html;
    }
    location /vf/dashboard/ {
        alias /opt/verifiable-forecasts/dashboard/;
        add_header Cache-Control "no-cache" always;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
