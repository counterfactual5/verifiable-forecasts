[project]
name = "vol-agents"
version = "0.1.0"
description = "Forecasting agents for VolMarket: small numpy-trained models exported to ONNX, proven with EZKL and submitted onchain."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ezkl>=23.0.5",
    "numpy>=2.0",
    "onnx>=1.17",
    "onnxruntime>=1.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
