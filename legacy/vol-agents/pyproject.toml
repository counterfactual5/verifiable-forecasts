[project]
name = "vol-agents"
version = "0.1.0"
description = "Forecast bots for the verifiable-forecasts: naive, EWMA and TimesFM behind one probability-vector interface, plus the offline backtest engine."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The pinned M1 acceptance probe ships the pre-implementation header of the
# roadmap; its unused stdlib imports are part of that pinned text.
"tests/test_m1_acceptance.py" = ["F401"]
